# Dev environment values

replicaCount: 1

deployApp: true

image:
  repository: ghcr.io/your-org/oip-web-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: oip-backend.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  DB_URL: jdbc:postgresql://definitiondatabase:5432/oip_web_backend
  DB_USER: oip_local
  SPRING_PROFILES_ACTIVE: local
  OIP_SECURITY_PERMIT_ALL: "true"
  OIP_SECURITY_JWT_EXPIRATION_MS: "3600000"

secrets:
  DB_PASSWORD: ""
  OIP_SECURITY_JWT_SECRET: ""

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

nodeSelector: {}
tolerations: []
affinity: {}
